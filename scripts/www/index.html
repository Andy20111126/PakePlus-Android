<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>旅行汤汤 · Travel Tangtang</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#ded1b3}
@font-face{font-family:"TangTang";src:url("assets/font/tang.ttf") format("truetype");font-weight:400 900;font-display:swap}
body{font-family:"TangTang","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;color:#1d1a16;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#phone{width:390px;height:844px;position:relative;overflow:hidden;border-radius:26px;background:#fcf4dd;box-shadow:0 24px 60px rgba(60,40,10,.35);transform-origin:center center}
img{-webkit-user-drag:none}

/* ---------- scene ---------- */
.scene{position:absolute;inset:0}
.scene .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(125% 85% at 50% 40%,rgba(255,255,255,0) 55%,rgba(70,45,10,.13) 100%)}
.scene-layer{position:absolute;inset:0}

/* ---------- hud ---------- */
.hud{position:absolute;top:0;left:0;right:0;padding:9px 11px 0;z-index:6;pointer-events:none}
.hud-row{display:flex;align-items:flex-start;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;background:rgba(252,241,208,.93);border-radius:999px;padding:3px 9px 3px 5px;font-size:12px;font-weight:800;box-shadow:0 2px 0 rgba(90,60,20,.12);line-height:1.5}
.pill img{width:17px;height:17px;image-rendering:pixelated}
.pill .ticket{width:16px;height:16px}
.ttcoin{width:18px;height:18px;display:inline-block;vertical-align:middle;flex:0 0 auto;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 1px 1px rgba(80,60,10,.18))}
.ticketimg{width:18px;height:18px;display:inline-block;vertical-align:middle;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 1px 1px rgba(40,70,40,.18))}
.pill .ttcoin{width:20px;height:20px}
.pill .ticketimg{width:22px;height:22px;image-rendering:auto}
.ticketico{width:36px;height:28px;object-fit:contain;image-rendering:auto}
.pr .ttcoin{width:15px;height:15px}
.coinico{display:flex;align-items:center;justify-content:center}
.coinico .ttcoin{width:38px;height:38px}
.scene-title{font-size:18px;font-weight:900;letter-spacing:1.5px;line-height:1.2;cursor:pointer;white-space:nowrap;background:rgba(252,241,208,.93);border-radius:999px;padding:2px 10px;box-shadow:0 2px 0 rgba(90,60,20,.12)}
.hud-row2{display:flex;align-items:center;gap:6px;margin-top:5px}
.pill.small{font-size:10.5px;font-weight:700;padding:2px 8px;gap:3px}
.spacer{flex:1}
.icon-btn{pointer-events:auto;width:26px;height:26px;border:0;border-radius:50%;background:rgba(252,241,208,.93);font-size:13px;font-weight:900;cursor:pointer;box-shadow:0 2px 0 rgba(90,60,20,.12);display:flex;align-items:center;justify-content:center;color:#1d1a16}

/* ---------- hotspots ---------- */
.hotspot{position:absolute;transform:translate(-50%,-50%);background:#F9E2A4;color:#1b1813;font-weight:900;font-size:13.5px;padding:5px 11px;border-radius:5px;white-space:nowrap;box-shadow:0 3px 0 rgba(90,60,20,.18);cursor:pointer;z-index:4;letter-spacing:1.5px;transition:transform .08s}
.hotspot:active{transform:translate(-50%,-50%) scale(.95)}
.hotspot.locked{background:#e8dcc0;color:#8b7c60}
.hotspot.label{cursor:default}
.hotspot.label:active{transform:translate(-50%,-50%)}
.hotspot .badge{position:absolute;top:-7px;right:-7px;min-width:17px;height:17px;border-radius:9px;background:#E4573D;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;letter-spacing:0;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.hotspot .badge.green{background:#5F8F5A}
.potspot{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:rgba(252,241,208,.35);border:2px dashed rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:4;box-shadow:0 2px 6px rgba(20,40,50,.18)}
.potspot.filled{background:rgba(247,229,186,.9);border:2px solid #fff;box-shadow:0 3px 8px rgba(20,40,50,.25)}
.potspot img{width:30px;height:30px;image-rendering:pixelated}
.potspot .potplus{font-size:20px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.potspot .potlbl{position:absolute;top:43px;font-size:9px;font-weight:800;color:#fff;background:rgba(26,55,66,.5);padding:1px 5px;border-radius:6px;white-space:nowrap;letter-spacing:.5px}
.potspot .badge{position:absolute;top:-7px;right:-7px;min-width:17px;height:17px;border-radius:9px;background:#5F8F5A;color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 3px 0 rgba(90,60,20,.18),0 0 0 0 rgba(255,220,120,.6)}50%{box-shadow:0 3px 0 rgba(90,60,20,.18),0 0 0 8px rgba(255,220,120,0)}}

/* ---------- characters ---------- */
.char{position:absolute;z-index:3;filter:drop-shadow(0 6px 6px rgba(60,40,10,.18));cursor:pointer;transform-origin:bottom center}
.char img{width:100%;display:block}
.friend-mark{position:absolute;top:-10px;right:8px;width:22px;height:22px;border-radius:50%;background:#FFE28A;border:2px solid #1d1a16;color:#1d1a16;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(90,60,20,.2);animation:hop 1.4s ease-in-out infinite;z-index:4;pointer-events:none}
.friend-card{display:flex;flex-direction:column;align-items:center;gap:9px;padding:2px 0 4px}
.friend-face{width:118px;height:118px;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 6px 6px rgba(60,40,10,.18))}
.friend-say{font-size:13px;font-weight:900;color:#4c4028;text-align:center;line-height:1.6}
.gift-row{display:flex;align-items:center;gap:10px;background:#FEF6DA;border:2px solid #1d1a16;border-radius:14px;padding:9px 16px;min-width:170px;justify-content:center}
.gift-row img{width:38px;height:38px;image-rendering:pixelated}
.gift-info{text-align:left}
.gift-info .nm{font-size:14px;font-weight:900;color:#1d1a16;line-height:1.3}
.gift-info .cnt{font-size:11px;font-weight:800;color:#8a6a2a;line-height:1.3}
.gift-lack{font-size:11.5px;font-weight:800;color:#a24a3a;text-align:center;line-height:1.6}
.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}
.tang-idle{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.01)}}
.bubble{position:absolute;z-index:7;background:#3f6fc4;color:#fff;font-size:12px;font-weight:700;border-radius:16px;padding:9px 12px;max-width:210px;line-height:1.45;box-shadow:0 5px 12px rgba(0,0,0,.18);cursor:pointer}
.bubble:after{content:"";position:absolute;bottom:-7px;left:22px;border:7px solid transparent;border-top-color:#3f6fc4;border-bottom:0}
.bubble .need{display:flex;align-items:center;gap:6px;margin-top:4px}
.bubble .need img{width:24px;height:24px;image-rendering:pixelated}
.bubble.warn{background:#C7543F}
.bubble.locked{cursor:default}
.bubble.warn:after{border-top-color:#C7543F}
.bubble.cream{background:#FBE9B8;color:#1d1a16}
.bubble.cream:after{border-top-color:#FBE9B8}

/* ---------- nav ---------- */
.nav{position:absolute;left:0;right:0;bottom:0;height:50px;display:flex;gap:3px;padding:0 10px 9px;z-index:8}
.nav button{flex:1;border:0;background:#F7DFA6;font-weight:900;font-size:14.5px;color:#1b1813;cursor:pointer;letter-spacing:1px;font-family:inherit;box-shadow:0 3px 0 rgba(90,60,20,.14)}
.nav button:active{transform:translateY(2px);box-shadow:none}
.nav .prev{clip-path:polygon(0% 50%,9% 0%,100% 0%,100% 100%,9% 100%)}
.nav .mid{clip-path:polygon(0 0,100% 0,96% 100%,4% 100%)}
.nav .next{clip-path:polygon(0 0,91% 0,100% 50%,91% 100%,0 100%)}
.nav button.only{clip-path:polygon(0% 50%,9% 0%,91% 0%,100% 50%,91% 100%,9% 100%)}

/* ---------- overlays / cards ---------- */
.overlay{position:absolute;inset:0;background:rgba(32,22,8,.4);display:flex;align-items:center;justify-content:center;z-index:20;animation:fadein .16s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.card{width:328px;max-height:730px;background:#FBE9B8;border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 14px 34px rgba(40,25,5,.4);animation:cardin .18s ease}
@keyframes cardin{from{transform:translateY(10px) scale(.98);opacity:.6}to{transform:none;opacity:1}}
.card.wide{width:346px}
.card-head{display:flex;align-items:flex-start;padding:14px 16px 6px;flex:0 0 auto}
.card-title{font-size:23px;font-weight:900;letter-spacing:2.5px;line-height:1.1}
.card-sub{font-size:10.5px;font-weight:700;color:#8a6a2a;margin-top:3px;letter-spacing:.5px}
.card-x{margin-left:auto;border:0;background:transparent;font-size:22px;font-weight:900;color:#E9B94C;cursor:pointer;line-height:1;font-family:inherit;padding:0 2px}
.card-body{overflow-y:auto;overflow-x:hidden;padding:2px 14px 16px;flex:1}
.card-body::-webkit-scrollbar{width:5px}
.card-body::-webkit-scrollbar-thumb{background:#d8bd7d;border-radius:3px}
.card-foot{padding:0 14px 14px;display:flex;gap:8px;flex:0 0 auto}

/* ---------- pieces ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.card-item{background:#FEF6DA;border:2px solid #1d1a16;border-radius:15px;padding:9px 5px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;min-height:0}
.card-item:active{transform:scale(.97)}
.card-item .ico{width:43px;height:43px;image-rendering:pixelated;object-fit:contain}
.card-item .nm{font-size:11.5px;font-weight:900;text-align:center;line-height:1.25;word-break:break-all}
.card-item .pr{font-size:10.5px;font-weight:700;color:#8a6a2a;display:flex;align-items:center;gap:3px}
.card-item .own{font-size:9.5px;font-weight:800;color:#8a6a2a;letter-spacing:0}
.card-item .pr img{width:12px;height:12px;image-rendering:pixelated}
.card-item.dim{opacity:.55}
.card-item .sold{position:absolute;top:5px;right:5px;background:#5F8F5A;color:#fff;font-size:9px;padding:1px 4px;border-radius:5px;font-weight:800}
.card-item .lock{position:absolute;inset:0;border-radius:13px;background:rgba(240,230,205,.65);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#7a6640;text-align:center;padding:4px}

.row{display:flex;align-items:center;gap:9px;background:#FEF6DA;border:2px solid #1d1a16;border-radius:14px;padding:8px 9px;margin-bottom:8px}
.row .ico{width:40px;height:40px;image-rendering:pixelated;object-fit:contain;flex:0 0 auto}
.row .ico.pc{width:56px;height:42px;object-fit:cover;border-radius:4px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.row .txt{flex:1;min-width:0}
.row .t1{font-size:12px;font-weight:900;line-height:1.3}
.row .t2{font-size:10px;font-weight:600;color:#7f6a42;margin-top:2px;line-height:1.3}
.row .end{flex:0 0 auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;border:0;background:#FADA92;font-weight:900;font-size:12.5px;padding:7px 12px;border-radius:9px;cursor:pointer;color:#1b1813;box-shadow:0 3px 0 rgba(120,80,20,.22);font-family:inherit;letter-spacing:.5px}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.primary{background:#F6C453}
.btn.ghost{background:#F3E3B8;color:#8a7850}
.btn.sm{font-size:11px;padding:5px 9px;box-shadow:0 2px 0 rgba(120,80,20,.22)}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.dark{background:#4C4433;color:#FBEFCB}
.btn.danger{background:#E4573D;color:#fff}

.tabs{display:flex;gap:5px;margin:2px 0 10px}
.tabs button{flex:1;border:0;background:#EEDCA9;font-weight:900;font-size:12.5px;padding:7px 4px;border-radius:8px;cursor:pointer;color:#6d5c38;font-family:inherit;letter-spacing:1px}
.tabs button.on{background:#F9E2A4;color:#1b1813;box-shadow:inset 0 -3px 0 #E0A93F}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:11px;font-size:11px;font-weight:700;color:#7f6a42}
.pager .btn{width:34px;height:28px;padding:0;font-size:13px}

.section-h{font-size:11.5px;font-weight:900;letter-spacing:1px;color:#6b5830;margin:12px 2px 7px;display:flex;align-items:center;gap:6px}
.hint{font-size:10.5px;font-weight:600;color:#7f6a42;line-height:1.5;margin:4px 2px 0}
.empty{text-align:center;font-size:12px;font-weight:700;color:#9a8457;padding:24px 10px;line-height:1.7}

/* ---------- postcard wall ---------- */
.wall{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);width:230px;height:120px;display:flex;justify-content:center;align-items:center;gap:8px;z-index:3}
.wall .pin{position:absolute;top:-4px;width:26px;height:8px;background:#c9a06a;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.pc{background:#fff;padding:4px;box-shadow:0 3px 8px rgba(0,0,0,.22);width:66px;cursor:pointer;position:relative}
.pc img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.pc .cap{display:none}
.wall .pc:nth-child(1){transform:rotate(-4deg)}
.wall .pc:nth-child(2){transform:rotate(2deg) translateY(-3px)}
.wall .pc:nth-child(3){transform:rotate(5deg)}
.wall-empty{position:absolute;left:50%;top:30.5%;transform:translate(-50%,-50%);width:210px;height:96px;border:2px dashed rgba(120,90,40,.55);border-radius:8px;color:rgba(110,85,40,.8);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.6;z-index:3;cursor:pointer}

/* ---------- gallery ---------- */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.gal .pc{width:100%;transform:none;padding:5px}
.gal .pc .cap{display:block;font-size:10.5px;font-weight:800;text-align:center;padding:4px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal .pc .lock{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:#EDE0BE;color:#a08a57;font-size:11px;font-weight:800}
.gal .pc.locked{background:#F3E8CB;cursor:default;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.gal .pc.locked .q{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:#E6D6AF;color:#B6A171;font-size:26px;font-weight:900}
.gal .pc.locked .cap{color:#A99463}
.big-pc{width:100%;background:#fff;padding:8px 8px 4px;box-shadow:0 8px 20px rgba(0,0,0,.3);transform:rotate(-1deg)}
.big-pc img{width:100%;border-radius:3px;display:block}
.big-pc .cap{font-size:12px;font-weight:900;text-align:center;padding:6px 0 3px}

/* ---------- loadout ---------- */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slots.pot-slots{grid-template-columns:repeat(3,1fr)}
.slot{background:#FEF6DA;border:2px solid #1d1a16;border-radius:15px;padding:9px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:94px;justify-content:center;cursor:pointer;position:relative}
.slot .lbl{font-size:11px;font-weight:900}
.slot .opt{font-size:9px;font-weight:700;color:#9a8457}
.slot .ico{width:34px;height:34px;image-rendering:pixelated;object-fit:contain}
.slot .plus{font-size:22px;font-weight:900;line-height:1;color:#6b5830}
.slot .nm{font-size:10.5px;font-weight:800;text-align:center;line-height:1.2}
.slot.filled{border-color:#5F8F5A}
.slot .clr{position:absolute;top:4px;right:6px;font-size:11px;font-weight:900;color:#C7543F}
.pot-cell{display:flex;flex-direction:column;gap:6px}
.pot-cell .slot{min-height:86px;padding-bottom:6px}
.slot-bait{width:100%;padding:5px 4px;border:2px solid #1d1a16;border-radius:10px;background:#FEF6DA;font-size:9px;font-weight:900;color:#6b5830;text-align:center;white-space:nowrap;cursor:pointer;line-height:1.2}
.slot-bait.on{background:#DDEBCF;border-color:#5F8F5A;color:#3f6f3a}
.slot .clr{position:absolute;top:4px;right:6px;font-size:11px;font-weight:900;color:#C7543F}
.desk{background:#EEDCA9;border-radius:14px;padding:9px 10px 4px;margin-top:8px}
.desk .t{font-size:13px;font-weight:900;letter-spacing:1px;margin-bottom:7px}
.desk .slots .slot{min-height:80px;background:#FBF0CE}

/* ---------- field ---------- */
.fieldwrap{position:absolute;inset:0}
.plot{position:absolute;transform:translate(-50%,-50%);width:86px;height:62px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:4}
.plot .soil{position:absolute;inset:0;border-radius:8px;background:rgba(120,80,40,.18);border:2px dashed rgba(240,225,180,.5)}
.plot .in{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px}
.plot img{width:40px;height:40px;image-rendering:pixelated;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.plot .plus{font-size:18px;font-weight:900;color:#FDF3D5;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.plot .st{font-size:9px;font-weight:800;color:#FDF3D5;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.plot.ready .in{animation:hop .8s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* ---------- fishing ---------- */
.fish-layer{position:absolute;inset:0;z-index:25;background:rgba(18,24,20,.55);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#FDF4DC}
#phone.fishmode .nav,#phone.fishmode #sceneLayer .hotspot,#phone.fishmode .potspot,#phone.fishmode .bubble{opacity:0;pointer-events:none}
#phone.fishmode .hud{opacity:.72}
.fish-track{position:relative;width:64px;height:300px;background:linear-gradient(180deg,#2e5b7d,#173a52);border:3px solid #0e2b3d;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 18px rgba(0,0,0,.5)}
.fish-track .bar{position:absolute;left:4px;right:4px;height:72px;background:linear-gradient(180deg,rgba(126,200,120,.85),rgba(86,160,90,.9));border:2px solid #b7e2a8;border-radius:7px;box-shadow:0 0 10px rgba(140,230,130,.5)}
.fish-track .fish{position:absolute;left:50%;width:30px;height:30px;margin-left:-15px;margin-top:-15px;image-rendering:pixelated;transition:transform .12s}
.fish-prog{width:250px;height:14px;border-radius:8px;background:rgba(255,255,255,.2);overflow:hidden;border:2px solid rgba(255,255,255,.35)}
.fish-prog i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#F6C453,#8FD47C);transition:width .1s}
.fish-title{font-size:15px;font-weight:900;letter-spacing:2px}
.fish-tip{font-size:11px;font-weight:700;color:#cfe3d3;text-align:center;line-height:1.6}

/* ---------- misc ---------- */
#toasts{position:absolute;left:50%;top:100px;transform:translateX(-50%);z-index:12;display:flex;flex-direction:column;gap:6px;pointer-events:none;width:300px}
.toast{background:rgba(35,28,18,.88);color:#FDF4DC;font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:10px;text-align:center;animation:pop .25s;line-height:1.4}
@keyframes pop{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:35;overflow:hidden}
.floaty{position:absolute;font-size:14px;font-weight:900;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.35);animation:floatup 1s ease-out forwards}
@keyframes floatup{from{transform:translateY(0);opacity:1}to{transform:translateY(-42px);opacity:0}}
.bigcenter{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:30px;font-weight:900;color:#FFF3C4;text-shadow:0 4px 0 rgba(120,60,10,.5);animation:bigpop .9s ease-out forwards;z-index:36}
@keyframes bigpop{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-75%) scale(1);opacity:0}}

.btnbar{display:flex;gap:8px;margin-top:10px}
.seed-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rec{background:#FEF6DA;border:2px solid #1d1a16;border-radius:14px;padding:9px;margin-bottom:9px;display:flex;gap:10px;align-items:center}

.rec .txt{flex:1;min-width:0}
.rec .t1{font-size:12.5px;font-weight:900}
.rec .t2{font-size:10px;font-weight:700;color:#7f6a42;margin-top:3px;line-height:1.45}

.inv-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:9px}

.badge-n{display:inline-block;margin-left:3px;background:#5F8F5A;color:#fff;border-radius:6px;font-size:9px;padding:0 4px}

/* lottery */
.slot-m{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 2px}
.slot-m .hex{width:150px;height:150px;position:relative;display:flex;align-items:center;justify-content:center}
.slot-m .hex .disc{width:118px;height:118px;background:linear-gradient(160deg,#cfcabc,#9e9a8e);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#3d3a32;text-align:center;padding:16px}
.slot-m .needle{position:absolute;width:44px;height:16px;left:50%;top:16px;margin-left:-22px;background:#6f6b60;clip-path:polygon(0 50%,50% 0,100% 50%,50% 100%);transition:transform .1s}
.slot-m .prize{font-size:13px;font-weight:900;color:#5b4a26;min-height:20px;text-align:center}

/* intro */
.intro-card{width:330px;background:#FBE9B8;border-radius:22px;padding:22px 20px 18px;box-shadow:0 16px 38px rgba(40,25,5,.45);text-align:center;animation:cardin .25s}
.intro-card .logo{font-size:34px;font-weight:900;letter-spacing:6px;line-height:1.15;margin-bottom:2px}
.intro-card .sub{font-size:11px;font-weight:700;color:#8a6a2a;letter-spacing:2px;margin-bottom:12px}
.intro-card .art{width:180px;margin:0 auto 8px;filter:drop-shadow(0 8px 10px rgba(60,40,10,.18))}
.intro-card .art img{width:100%;display:block}
.intro-card ul{text-align:left;font-size:11.5px;font-weight:700;line-height:1.85;color:#4c4028;margin:8px 2px 14px;padding-left:18px}
.intro-card ul b{color:#1d1a16}

/* 钱田：汤汤币长在茎叶上 */
.coins{position:absolute;transform:translate(-50%,-50%);display:flex;flex-wrap:wrap;width:192px;justify-content:center;gap:2px 8px;z-index:3;pointer-events:none}
.coins .c{position:relative;display:block;width:42px;height:56px;pointer-events:auto;cursor:pointer;transform-origin:50% 100%;animation:sway 2.8s ease-in-out infinite}
.coins .c .ttcoin{position:absolute;left:50%;top:0;margin-left:-18px;width:36px;height:36px;image-rendering:auto;filter:drop-shadow(0 2px 2px rgba(80,60,10,.22))}
.coins .c .stem{position:absolute;left:50%;top:28px;margin-left:-2px;width:4px;height:24px;border-radius:2px;background:linear-gradient(#83b45e,#4d8439)}
.coins .c .leaf{position:absolute;width:18px;height:10px;background:#5da24b;border-radius:100% 0 100% 0;box-shadow:inset -2px -2px 0 rgba(40,70,28,.10)}
.coins .c .leaf.l1{left:50%;top:30px;transform:rotate(28deg);transform-origin:0 100%}
.coins .c .leaf.l2{right:50%;top:38px;border-radius:0 100% 0 100%;transform:rotate(-28deg);transform-origin:100% 100%}
.coins .c:active{filter:brightness(1.15)}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.hotspot.big{font-size:17px;letter-spacing:3px;padding:10px 30px;border-radius:8px;background:#F6D98F}

/* 钓鱼 */
.fish-stage{display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:300px;gap:12px}
.charge-hint{font-size:13px;font-weight:800;color:#cfe3d3;letter-spacing:2px}
.power{width:210px;height:16px;border:2px solid rgba(255,255,255,.5);border-radius:10px;overflow:hidden;background:rgba(255,255,255,.15)}
.power i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ED0E8,#F6C453,#F07A50)}
.power-num{font-size:14px;font-weight:900;color:#fff}
.bobber{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;animation:bob 1.6s ease-in-out infinite}
.bobber span{width:16px;height:16px;border-radius:50%;background:#E4573D;border:3px solid #fff;box-shadow:0 0 0 6px rgba(255,255,255,.14)}
@keyframes bob{0%,100%{transform:translateY(-8px)}50%{transform:translateY(8px)}}
.bite{font-size:74px;font-weight:900;color:#FFE28A;text-shadow:0 6px 0 rgba(0,0,0,.25);animation:biteIn .45s ease}
@keyframes biteIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.big-btn{font-size:18px;padding:12px 36px;letter-spacing:4px}
.fish-layer .btn{margin-top:2px}
.fish-layer .fish-track .bar{height:72px}
.dbg-box{margin-top:14px;border-top:2px dashed rgba(120,90,40,.35);padding-top:10px}
.dbg-title{font-size:12px;font-weight:900;color:#1d1a16;margin-bottom:6px}
.dbg-codes{font-size:11px;line-height:1.7;color:#6a5636;font-weight:700}
.dbg-row{display:flex;gap:8px;margin-top:10px;align-items:center}
.dbg-input{flex:1;min-width:0;height:38px;box-sizing:border-box;background:#FFFDF2;border:2px solid #1d1a16;border-radius:12px;padding:0 10px;font-family:inherit;font-size:12px;font-weight:900;color:#1d1a16;outline:none;letter-spacing:1px}
.dbg-input::placeholder{color:#b0a184;font-weight:700;letter-spacing:0}
.dbg-input:focus{box-shadow:0 0 0 3px rgba(255,196,70,.35)}
.dbg-out{margin-top:8px;font-size:11.5px;line-height:1.7;font-weight:800;color:#7a4b12;white-space:pre-line;min-height:14px}
.sellbin{position:absolute;left:5%;top:73%;width:84px;image-rendering:pixelated;cursor:pointer;z-index:3;filter:drop-shadow(0 5px 5px rgba(60,40,10,.18))}
.sell-row{display:flex;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px dashed rgba(120,90,40,.3)}
.sell-row .ico{width:34px;height:34px;image-rendering:pixelated;flex:none}
.sell-row .txt{flex:1;min-width:0}
.sell-row .t1{font-size:12px;font-weight:900;line-height:1.3}
.sell-row .t2{font-size:10px;font-weight:700;color:#8a6a2a;line-height:1.3}
.sell-row .end{display:flex;gap:5px;flex:none}
.pot-bait{display:flex;flex-direction:column;gap:3px;align-items:flex-start;margin-bottom:8px}
.pot-bait-tip{font-size:10px;font-weight:700;color:#8a6a2a}
.chip{border:2px solid rgba(255,255,255,.45);background:rgba(30,60,40,.55);color:#eaf3e4;font-size:10px;font-weight:800;font-family:inherit;padding:4px 8px;border-radius:8px;cursor:pointer;line-height:1.2}
.chip.on{background:#F6C453;color:#1b1813;border-color:#1b1813}
.gear-set{display:flex;flex-direction:column;gap:10px;padding:4px 2px 2px}
.gear-set .gear-line{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;font-weight:900;color:#5b4a26}
.gear-set .chip{background:#FEF6DA;color:#5b4a26;border-color:#d9be83;font-size:11px}
.gear-set .chip.on{background:#F6C453;color:#1b1813;border-color:#1b1813}
.gear-set .gear-tip{font-size:11px;line-height:1.6;color:#8a6a2a;font-weight:800;background:rgba(255,255,255,.4);border-radius:8px;padding:6px 8px}
.gear-set .gear-none{font-size:11px;color:#a24a3a;font-weight:800}
.fish-gear{margin-top:12px;display:flex;flex-direction:column;gap:5px;align-items:center;max-width:300px}
.gear-line{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:10px;font-weight:800;color:#e9f1df}
.gear-none{font-size:10px;color:#cfe3d3;font-weight:700}
.gear-tip{font-size:10px;color:#cfe3d3;text-align:center;line-height:1.5;font-weight:700}
.lot-m{display:flex;flex-direction:column;align-items:center;gap:10px;padding:2px 0}
.garapon{display:flex;flex-direction:column;align-items:center;gap:6px}
.g-head{background:#C7543F;color:#FDF4DC;font-weight:900;font-size:13px;letter-spacing:3px;padding:4px 22px;border:3px solid #1d1a16;border-radius:8px;box-shadow:0 3px 0 rgba(120,80,20,.25)}
.g-cab{position:relative;width:240px;height:200px;background:linear-gradient(180deg,#FBE9B8,#F3D28B);border:4px solid #1d1a16;border-radius:14px;box-shadow:0 6px 0 rgba(120,80,20,.22);overflow:hidden}
.g-cab:before{content:"";position:absolute;left:0;right:0;top:0;height:22px;background:#E7B25E;border-bottom:3px solid #1d1a16}
.g-drum{position:absolute;left:38px;top:26px;width:124px;height:124px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.92),rgba(228,244,255,.45) 55%,rgba(170,210,235,.55));border:5px solid #1d1a16;box-shadow:inset 0 0 18px rgba(0,0,0,.15);z-index:2}
.gb{position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid rgba(29,26,22,.55);box-shadow:inset -2px -2px 0 rgba(0,0,0,.15)}
.gb.b1{left:52px;top:14px}.gb.b2{left:78px;top:26px}.gb.b3{left:92px;top:54px}.gb.b4{left:78px;top:84px}
.gb.b5{left:48px;top:92px}.gb.b6{left:20px;top:74px}.gb.b7{left:12px;top:44px}.gb.b8{left:30px;top:20px}
.g-crank{position:absolute;right:4px;top:102px;width:44px;height:22px;z-index:3;transform-origin:8px 50%}
.g-crank:before{content:"";position:absolute;left:0;top:6px;width:40px;height:9px;background:#8a5a37;border:3px solid #1d1a16;border-radius:5px;box-sizing:border-box}
.g-crank:after{content:"";position:absolute;right:0;top:0;width:20px;height:20px;border-radius:50%;background:#8a5a37;border:3px solid #1d1a16;box-sizing:border-box}
.g-chute{position:absolute;left:50%;margin-left:-32px;bottom:44px;width:64px;height:14px;background:#8a5a37;border:3px solid #1d1a16;border-radius:7px;z-index:3;box-sizing:border-box}
.g-tray{position:absolute;left:50%;margin-left:-46px;bottom:8px;width:92px;height:26px;background:#FBE9B8;border:3px solid #1d1a16;border-radius:9px;z-index:3;box-shadow:inset 0 -4px 0 rgba(120,80,20,.15);box-sizing:border-box}
.g-out{display:none;position:absolute;left:50%;top:-6px;width:20px;height:20px;margin-left:-10px;border-radius:50%;border:2px solid rgba(29,26,22,.6);box-shadow:inset -3px -3px 0 rgba(0,0,0,.15)}
.g-out.drop{display:block;animation:gdrop .55s cubic-bezier(.3,1.4,.6,1)}
@keyframes gdrop{0%{transform:translateY(-64px);opacity:0}60%{transform:translateY(4px);opacity:1}100%{transform:translateY(0)}}
.garapon.spinning .g-drum{animation:gdrum .34s linear infinite}
.garapon.spinning .g-crank{animation:gcrank .34s linear infinite}
@keyframes gdrum{to{transform:rotate(360deg)}}
@keyframes gcrank{to{transform:rotate(360deg)}}
.lot-m .prize{font-size:13px;font-weight:900;color:#5b4a26;min-height:20px;text-align:center}
.lot-balls{display:grid;grid-template-columns:repeat(4,34px);gap:14px 16px;justify-content:center;padding:18px 20px;background:#FEF6DA;border:3px solid #1d1a16;border-radius:18px;box-shadow:0 5px 0 rgba(120,80,20,.2)}
.lot-balls .gb{position:static;width:34px;height:34px;border:3px solid rgba(29,26,22,.6);box-shadow:inset -3px -3px 0 rgba(0,0,0,.16)}
.lot-balls.spinning .gb{animation:gshake .3s ease-in-out infinite}
.lot-balls.spinning .gb:nth-child(2n){animation-delay:.05s}
.lot-balls.spinning .gb:nth-child(3n){animation-delay:.1s}
@keyframes gshake{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,2px)}75%{transform:translate(2px,-2px)}}
.lot-result{display:flex;flex-direction:column;align-items:center;gap:5px;min-height:56px}
.lot-result .g-out{position:static;display:none;width:38px;height:38px;margin:0;border:3px solid rgba(29,26,22,.6);box-shadow:inset -4px -4px 0 rgba(0,0,0,.16)}
.lot-result .g-out.drop{display:block;animation:none;opacity:1}


</style>

<body>
<div id="stage">
  <div id="phone">
    <div class="scene">
      <div class="scene-layer" id="sceneLayer"></div>
      <div class="vignette"></div>
    </div>

    <div class="hud">
      <div class="hud-row">
        <div class="pill"><img class="ttcoin" src="assets/ui/tangcoin.png" alt=""><span id="coinVal">0</span></div>
        <div class="pill"><img class="ticketimg" src="assets/ui/tangticket.png" alt=""><span id="ticketVal">0</span></div>
        <div class="spacer"></div>
        <button class="icon-btn" id="muteBtn" title="音效开关">♪</button>
        <button class="icon-btn" id="helpBtn" title="设置">?</button>
      </div>
      <div class="hud-row2">
        <div class="scene-title" id="sceneTitle">门口</div>
        <div class="pill small" id="clockPill">--:--</div>
        <div class="pill small" id="countPill">汤汤在家</div>
      </div>
    </div>

    <div class="nav" id="nav"></div>
    <div id="modals"></div>
    <div id="fx"></div>
    <div id="toasts"></div>
  </div>
</div>

<script>
'use strict';
// ======================= 基础数据 =======================
const ASSETS = 'assets/';
const ICON_DIR = 'data:,icon-';
// 汤汤币图标：使用作者提供的 assets/ui/tangcoin.png（与汤汤券同一套扁平风格）
const COIN_IMG = '<img class="ttcoin" src="assets/ui/tangcoin.png" alt="">';

const ITEMS = {};
function reg(o) {
  ITEMS[o.id] = Object.assign({ type: 'misc', tags: [], price: 0, desc: '' }, o);
}

// ---------- 兴趣物 / 补给 / 护符 ----------
reg({ id: 'Single_Bed', name: '床', icon: 'Single_Bed.png', type: 'interest', price: 25, tags: ['home'], desc: '睡惯了的小床，带上就像把家揣进了背包。' });
reg({ id: 'Secret_Note', name: '地图', icon: 'Secret_Note.png', type: 'interest', price: 20, tags: ['city', 'far'], desc: '皱巴巴的手绘地图，指着一堆没去过的地方。' });
reg({ id: 'Stone', name: '石头', icon: 'Stone.png', type: 'small', tags: ['gift', 'nature'], desc: '鱼塘里捞上来的石头，也能当小礼物。' });
reg({ id: 'Bomb', name: '炸弹', icon: 'Bomb.png', type: 'interest', price: 25, tags: ['fun'], desc: '会冒烟的圆炸弹，汤汤说只是玩具。' });
reg({ id: '20160306214904_Campfire', name: '篝火', icon: '20160306214904_Campfire.png', type: 'interest', price: 25, tags: ['nature', 'camp'], desc: '小小的篝火堆，夜里烤手刚好。' });
reg({ id: 'Bamboo_Pole', name: '鱼竿', icon: 'Bamboo_Pole.png', type: 'interest', price: 20, tags: ['sea', 'nature'], desc: '竹子做的鱼竿。买了它才能去鱼塘钓鱼。', rod: true });

reg({ id: 'Maki_Roll', name: '寿司卷', icon: 'Maki_Roll.png', type: 'food', price: 15, desc: '一口一个，路上吃刚好。' });
reg({ id: 'Farmer_s_Lunch', name: '健康午餐', icon: 'Farmer_s_Lunch.png', type: 'food', price: 20, desc: '有菜有肉，吃完走得更远。' });
reg({ id: 'Fried_Egg', name: '煎蛋', icon: 'Fried_Egg.png', type: 'food', price: 10, desc: '边缘焦一点才好吃。' });
reg({ id: 'Pancakes', name: '松饼', icon: 'Pancakes.png', type: 'food', price: 25, desc: '淋上枫糖浆，早餐天花板。' });
reg({ id: 'Baked_Fish', name: '烤鱼', icon: 'Baked_Fish.png', type: 'food', price: 30, desc: '撒点盐，香得汤汤走不动。' });
reg({ id: 'Salad', name: '沙拉', icon: 'Salad.png', type: 'food', price: 20, desc: '清爽，适合长途。' });
reg({ id: 'Trout_Soup', name: '鱼汤', icon: 'Trout_Soup.png', type: 'food', price: 30, desc: '热乎乎的汤，喝完不冷了。' });
reg({ id: 'Coffee', name: '咖啡', icon: 'Coffee.png', type: 'food', price: 20, desc: '提神，但汤汤喝了会蹦跶。' });
reg({ id: 'Pizza', name: '披萨', icon: 'Pizza.png', type: 'food', price: 50, desc: '一整张，够吃一路。' });
reg({ id: 'Fried_Mushroom', name: '炒蘑菇', icon: 'Fried_Mushroom.png', type: 'food', price: 20, desc: '香得冒烟，小心烫。' });
reg({ id: 'Cookie', name: '饼干', icon: 'Cookie.png', type: 'food', price: 30, desc: '碎屑会撒满背包，但值得。' });
reg({ id: 'Fish_Taco', name: '鱼卷', icon: 'Fish_Taco.png', type: 'food', price: 40, desc: '卷饼里塞满了鱼肉。' });
reg({ id: 'Golden_Walnut', name: '金核桃', icon: 'Golden_Walnut.png', type: 'charm', price: 30, tags: ['luck'], desc: '护符（消耗品）：据说带着它，摇奖手气会变好。' });
reg({ id: 'Fireworks__Red', name: '烟花', icon: 'Fireworks__Red.png', type: 'charm', price: 30, tags: ['fun'], desc: '护符（消耗品）：路上放一支，心情就亮了。' });
reg({ id: 'GoldPile', name: '零钱', icon: '27px-Gold.png', type: 'charm', price: 30, tags: ['luck'], desc: '护符（消耗品）：一小袋零钱，关键时候能救急。' });

// ---------- 钓鱼用品 / 垃圾 ----------
reg({ id: 'Cork_Bobber', name: '软木塞浮标', icon: 'Cork_Bobber.png', type: 'bobber', price: 200, desc: '钓鱼时绿条更大一点，容错更高。' });
reg({ id: 'Lead_Bobber', name: '铅质浮标', icon: 'Lead_Bobber.png', type: 'bobber', price: 200, desc: '绿条更沉，触底不会弹起来。' });
reg({ id: 'Treasure_Hunter', name: '寻宝者浮标', icon: 'Treasure_Hunter.png', type: 'bobber', price: 200, desc: '钓鱼不会再钓到垃圾。' });
reg({ id: 'Bait', name: '鱼饵', icon: 'Bait.png', type: 'bait', price: 20, desc: '20 汤汤币 3 个。挂在鱼竿上咬钩更快，放进蟹笼也能用。' });
reg({ id: 'Trash', name: '垃圾', icon: 'Trash.png', type: 'trash', desc: '钓上来的杂物，攒着能做鱼饵。' });
reg({ id: 'Soggy_Newspaper', name: '湿报纸', icon: 'Soggy_Newspaper.png', type: 'trash', desc: '湿透的旧报纸，也是垃圾。' });
reg({ id: 'Broken_CD', name: '破 CD', icon: 'Broken_CD.png', type: 'trash', desc: '划花的旧光盘，也是垃圾。' });
reg({ id: 'Broken_Glasses', name: '破眼镜', icon: 'Broken_Glasses.png', type: 'trash', desc: '镜片裂了的旧眼镜，也是垃圾。' });

// ---------- 材料 ----------
reg({ id: 'Oil', name: '油', icon: 'Oil.png', type: 'material', price: 20, desc: '做饭必备。' });
reg({ id: 'Sugar', name: '糖', icon: 'Sugar.png', type: 'material', price: 20, desc: '甜味的来源。' });
reg({ id: 'Wheat_Flour', name: '面粉', icon: 'Wheat_Flour.png', type: 'material', price: 20, desc: '面食的基础。' });
reg({ id: 'Vinegar', name: '醋', icon: 'Vinegar.png', type: 'material', price: 20, desc: '拌菜调味都靠它。' });
reg({ id: 'Large_Egg', name: '大鸡蛋', icon: 'Large_Egg.png', type: 'material', price: 10, desc: '个头很大，煎一个顶俩。' });
reg({ id: 'Wheat', name: '小麦', icon: 'Wheat.png', type: 'material', price: 20, desc: '金灿灿的一把。' });

// ---------- 工具 ----------
reg({ id: 'Campfire_Cooker', name: '野炊工具', icon: 'Campfire_Cooker.png', type: 'tool', price: 300, desc: '能做饭的野炊架，买下后放置可用。' });
reg({ id: 'Workbench', name: '工作台', icon: 'Workbench.png', type: 'tool', price: 200, desc: '叮叮当当，能做后院要用的东西。' });

  if (!state.loadoutSaved) { toast('先在背包里点“保存”'); return; }
  if (!canDepart()) { toast('兴趣物和补给都要装上'); return; }

function allSmall() { return Object.keys(ITEMS).filter(id => ITEMS[id].type === 'small'); }

  let coins = ri(8, 24);
  if (l.charm === 'GoldPile') coins += 15;

function spin() {
  if (spinning) return;
  if (state.tickets < 1) { toast('汤汤券不够，招待朋友或让汤汤旅行都能拿到'); return; }
  state.tickets -= 1; renderHUD();
  spinning = true;
  const gar = $('#garapon'), prize = $('#prize'), out = $('#gout');
  if (gar) gar.classList.add('spinning');
  if (out) { out.className = 'g-out'; out.style.background = ''; }
  let n = 0;
  const timer = setInterval(function () {
    n++;
    if (prize) prize.textContent = '……';
    if (n > 11) {
      clearInterval(timer);
      if (gar) gar.classList.remove('spinning');
      const pr = weighted(LOTTERY, LOTTERY.map(p => p.w));
      grantPrize(pr);
      spinning = false;
    }
  }, 80);
}
function grantPrize(pr) {
  let label = pr.label;
  if (pr.t === 'coins') { state.coins += pr.n; }
  else if (pr.t === 'tickets') { state.tickets += pr.n; }
  else if (pr.t === 'seed') {
    const cs = CROPS.slice().sort(() => Math.random() - 0.5).slice(0, pr.n);
    cs.forEach(c => addItem(c.seed, 1));
    label = cs.map(c => c.name + '种子').join('、');
  } else if (pr.t === 'small') {
    const ids = [];
    for (let i = 0; i < pr.n; i++) { const id = pick(allSmall()); ids.push(id); addItem(id, 1); }
    label = ids.map(id => ITEMS[id].name).join('、');
  } else if (pr.t === 'food') {
    const pool = Object.keys(ITEMS).filter(id => ITEMS[id].type === 'food');
    const id = pick(pool); addItem(id, 1); label = ITEMS[id].name;
  }
  const prize = $('#prize'), out = $('#gout');
  if (prize) prize.textContent = '抽到了：' + label;
  if (out) {
    out.className = 'g-out drop';
    out.style.background = PRIZE_COLOR[pr.t] || '#f4c443';
  }
  toast('摇到了：' + label);
  renderHUD(); renderScene(); save();
}

function ingLabel(ing) {
  if (ing.cat === 'fish') return '任意鱼×' + ing.n;
  if (ing.cat === 'crop') return '任意作物×' + ing.n;
  if (ing.cat === 'trash') return '任意垃圾×' + ing.n;
  return (ITEMS[ing.id] ? ITEMS[ing.id].name : ing.id) + '×' + ing.n;
}
function ingHave(ing) {
  if (ing.cat === 'fish') return countType('fish') + countType('pot');
  if (ing.cat === 'crop') return countType('crop');
  if (ing.cat === 'trash') return countType('trash');
  return inv(ing.id);
}
function countType(t) { let n = 0; Object.keys(ITEMS).forEach(id => { if (ITEMS[id].type === t) n += inv(id); }); return n; }
function consumeIng(ing) {
  if (ing.cat) {
    let need = ing.n;
    Object.keys(ITEMS).forEach(function (id) {
      if (!need) return;
      const t = ITEMS[id].type;
      if ((t === ing.cat || (ing.cat === 'fish' && t === 'pot')) && inv(id) > 0) {
        const use = Math.min(need, inv(id));
        addItem(id, -use); need -= use;
      }
    });
  } else addItem(ing.id, -ing.n);
}
function craft(recipeId) {
  const r = RECIPES.filter(x => x.id === recipeId)[0] || CRAFTS.filter(x => x.id === recipeId)[0];
  if (!r) return;
  if (!r.need.every(ing => ingHave(ing) >= ing.n)) { toast('材料不够'); return; }
  r.need.forEach(consumeIng);
  addItem(r.out, r.outN || 1);
  toast('做好了：' + ITEMS[r.out].name + (r.outN > 1 ? ' ×' + r.outN : ''));

function sellUnit(id) {

  return Math.round((0.1 + (s % 9) / 10) * 10) / 10;
}

function sellOne(id) {
  if (!sellable(id) || inv(id) <= 0) return;

function sellAll(id) {

}

  fishing.barTop = clamp(fishing.fishY - fishing.barH / 2, 0, TRACK_H - fishing.barH);
  fishing.barVy = 0;
  fishing.fishTarget = rnd(30, 270);
  fishing.nextTarget = performance.now() + 500;
  fishing.prog = 0.34;

function updateFight(dt, ts) {
  const f = fishing;
  if (ts > f.nextTarget) {
    f.nextTarget = ts + rnd(600, 1400);
    if (Math.random() < 0.45) f.fishTarget = clamp(f.barTop + rnd(-20, BAR_H + 20), 18, TRACK_H - 18);
    else f.fishTarget = rnd(20, TRACK_H - 20);
  }
  const step = 235 * f.species.speed * dt;
  const d = f.fishTarget - f.fishY;
  if (Math.abs(d) <= step) f.fishY = f.fishTarget;
  else f.fishY += Math.sign(d) * step;

  f.barVy += (f.hold ? -1250 : 620) * dt;
  f.barVy = clamp(f.barVy, -430, 430);
  f.barTop += f.barVy * dt;
  if (f.barTop < 0) { f.barTop = 0; f.barVy = 0; }
  if (f.barTop > TRACK_H - f.barH) { f.barTop = TRACK_H - f.barH; f.barVy = f.lead ? 0 : -40; }

  const inBar = f.fishY >= f.barTop - 4 && f.fishY <= f.barTop + f.barH + 4;
  if (inBar) { f.prog += 0.33 * dt; f.outTime = 0; }
  else { f.prog -= 0.22 * dt; f.outTime += dt; if (f.outTime > 0.2) f.perfect = false; }
  f.prog = clamp(f.prog, 0, 1);

  if (f.el.bar) f.el.bar.style.top = f.barTop + 'px';
  if (f.el.fish) f.el.fish.style.top = f.fishY + 'px';
  if (f.el.prog) f.el.prog.style.width = (f.prog * 100).toFixed(1) + '%';

  if (f.prog >= 1) fishWin();
  else if (f.prog <= 0) fishFail('线松了，鱼溜走了');
}

    state.trip.t1 = now();
    tick(); save();
    return '汤汤已回家，奖励进信箱了';
  }
  if (cmd === 'P' || cmd === 'ITEM') {
    if (!toks[1]) return '请输入要添加的物品';
    const id = debugAnyItem(toks[1]);
    if (!id) return '找不到这个物品：' + toks[1];
    const n = Math.max(1, Math.min(999, parseInt(toks[2], 10) || 1));
    addItem(id, n);
    renderHUD(); save();
    return ITEMS[id].name + ' +' + n + '，背包里现在有 ' + inv(id) + ' 个';
  }
  if (cmd === 'M' || cmd === 'MONEY') {
    state.lastMoney = now() - T(12 * 3600) * 1000 - 1000;
    state.moneyPlants = []; state.moneySeed = 0;
    tick(); if (state.scene === 0) renderScene();
    save();
    return '钱田成熟了，一共 ' + (state.moneyPlants || []).reduce((a, b) => a + b, 0) + ' 个汤汤币';
  }
  if (cmd === 'CODES' || cmd === 'LIST' || cmd === '?') {
    return '作弊码不在界面里展示';
  }
  return '作弊码无效：' + raw;
}
function runDebug() {
  const el = $('#dbgInput');
  const raw = el ? el.value : '';
  const res = execDebug(raw);
  if (el) el.value = '';
  dbgSay(res);
  if (el) el.focus();
  return res;
}
function openHelp() {
  openPanel({
    title: '设置', sub: '重新开始与作弊码',
    mount: function (body) {
      const inp = body.querySelector('#dbgInput');
      if (inp) inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); playClick(); runDebug(); }
      });
    },
    render: function () {
      return '<div class="dbg-box">' +
        '<div class="dbg-title">作弊码</div>' +
        '<div class="dbg-row"><input id="dbgInput" class="dbg-input" type="text" placeholder="输入作弊码" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn primary" data-act="runDebug">执行</button></div>' +
        '<div class="dbg-out" id="dbgOut"></div>' +
        '</div>' +
        '<div class="hint">重新开始会清空当前存档。</div>' +
        '<button class="btn danger full" data-act="resetGame">重新开始游戏</button>';
    }
  });
}
function resetGame() {
  openPanel({
    title: '重新开始',
    sub: '二次确认 · 会清空所有进度',
    render: function () {
      return '<div class="hint">此操作不可恢复，确定要清空存档重新开始吗？</div>' +
        '<div class="btnbar"><button class="btn ghost" style="flex:1" data-act="close">取消</button>' +
        '<button class="btn danger" style="flex:1" data-act="confirmReset">确认清空</button></div>';
    }
  });
}
function confirmReset() {
  localStorage.removeItem(SAVE_KEY);
  closeAll();
  location.reload();
}
function showIntro() {
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'intro';
  ov.innerHTML = '<div class="intro-card"><div class="logo">旅行汤汤</div><div class="sub">TRAVEL TANGTANG</div>' +
    '<div class="art"><img src="' + CH_DIR + 'tang_walk.png"></div>' +
    '<button class="btn primary full" data-act="startGame">开始</button></div>';
  $('#phone').appendChild(ov);
}

/* ================= 19. 动作 ================= */
const ACTIONS = {
  close: function () { closeTop(); },
  prevScene: function () { state.scene = (state.scene + SCENES.length - 1) % SCENES.length; renderScene(); save(); },
  nextScene: function () { state.scene = (state.scene + 1) % SCENES.length; renderScene(); save(); },
  pickCoin: function (i) { pickCoin(Number(i)); },
  openMail: openMail,
  claim: function (uidStr) { claimMail(uidStr); },
  claimAll: function () { while (state.mailbox.length) claimMail(state.mailbox[0].uid); },
  giveFriend: giveFriend,
  runDebug: runDebug,
  openFriend: openFriend,
  patTang: function () {
    state.tangFace = (state.tangFace + 1) % TANGS.length;
    const lines = ['嘿嘿，被你发现我在偷懒。', '今天想去海边，你呢？', '背包还没收，等一下下。', '困了…再躺三分钟。'];
    renderScene();
    const b = document.querySelector('#sceneLayer .bubble.cream');
    if (b) b.textContent = pick(lines);
    save();
  },
  openGallery: function () { openGallery(0); },
  galleryPage: function (p) { galPage = Math.max(0, Number(p)); if (panels.length) refreshTop(); else openGallery(galPage); },
  viewPostcard: function (id) { openPostcard(id); },
  openShop: openShop,
  openSellBin: function () { if (panels.length) closeAll(); openSellBin(); },
  sellOne: function (id) { sellOne(id); },
  sellAll: function (id) { sellAll(id); },
  shopTab: function (k) { shopTab = k; refreshTop(); },
  shopPage: function (d) { const k = shopTab; const pages = SHOP[k].length; shopPage[k] = clamp(shopPage[k] + Number(d), 0, pages - 1); refreshTop(); },
  buy: function (id) { buy(id); },
  openLottery: function () { closeAll(); openLottery(); },
  spin: spin,
  openProjects: openProjects,
  openCook: openCook,
  openCraft: openCraft,
  openInventory: openInventory,
  needTool: function (name) { needTool(name); },
  craft: function (id) { craft(id); },
  invTab: function (t) { invTab = t; refreshTop(); },
  openLoadout: openLoadout,
  slot: function (key) { openPicker(key); },
  clearSlot: function (key) { state.loadout[key] = null; state.loadoutSaved = false; state.departAt = 0; refreshTop(); save(); },
  pick: function (id, el) { state.loadout[el.dataset.slot] = id; state.loadoutSaved = false; state.departAt = 0; closeTop(); refreshTop(); save(); },
  saveLoadout: saveLoadout,
  depart: depart,
  plotClick: plotClick,
  plant: function (id, el) { plant(Number(el.dataset.pos), id); },
  openField: openField,
  usePlotItem: function (id, el) { usePlotItem(Number(el.dataset.arg), el.dataset.item); },
  harvestNow: function (i, el) { harvestNow(Number(i), el); },
  openPots: openPots,
  placePot: function (i) { placePot(Number(i)); },
  collectPot: function (i) { collectPot(Number(i)); },
  potBaitToggle: function () { state.potBait = !state.potBait; refreshTop(); save(); },
  potBaitOpen: function (i) { potBaitOpen(Number(i)); },
  pickPotBait: function (i, el) { pickPotBait(i, el); },
  collectAllPots: collectAllPots,
  potSlot: function (i) { potSlot(Number(i)); },
  fishHook: hookFish,
  fishQuit: function () { closeFishUI(); },
  openFishSetup: openFishSetup,
  fishStart: fishStart,
  fishBobber: function (id) { fishBobber(id); },
  fishBait: fishBait,
  fishBobberPick: function () { openFishPicker('bobber'); },
  fishBaitPick: function () { openFishPicker('bait'); },
  pickFishBobber: function (id) { pickFishBobber(id); },
  pickFishBait: function (on) { pickFishBait(on); },
  startGame: function () { state.seenIntro = true; const e = document.getElementById('intro'); if (e) e.remove(); save(); },
  resetGame: resetGame,
  confirmReset: confirmReset
};

/* ================= 20. 主循环 ================= */
let lastMoneyReady = null, lastPotReady = null, saveTick = 0;
function tick() {
  const t = now();
  renderClock();
  if (state.trip && t >= state.trip.t1) onReturn();
  if (!state.trip) {
    if (!state.friend) maybeVisit();
    if (state.friend && t >= state.friend.until) {
      state.friend = null; state.friendTalk = false; state.friendNext = t + T(6 * 3600) * 1000;
      if (state.scene === 0) renderScene();
      save();
    }
  }
  const mr = moneyReady();
  if (mr !== lastMoneyReady) { lastMoneyReady = mr; if (state.scene === 0) renderScene(); }
  const pr = potReadyCount();
  if (pr !== lastPotReady) { lastPotReady = pr; if (state.scene === 4) renderScene(); }
  if (state.scene === 3) updatePlotsLive();
  if (!fishing && panels.length && panels[panels.length - 1].cfg.title === '鱼塘') refreshTop();
  if (!panels.length && state.scene === 4 && $('#fishBtn') && !fishing) bindFishBtnOnce();
  saveTick++;
  if (saveTick % 5 === 0) save();
}
function updatePlotsLive() {
  $$('#sceneLayer .plot').forEach(function (el) {
    const i = Number(el.dataset.arg);
    const sig = plotSig(i);
    if (el.dataset.sig !== sig) {
      el.dataset.sig = sig;
      el.innerHTML = plotInner(i);
      el.classList.toggle('ready', plotReady(i));
    }
  });
}
let fishBtnBound = false;
function bindFishBtnOnce() {
  const fb = $('#fishBtn');
  if (!fb || fb.dataset.bound) return;
  fb.dataset.bound = '1';
  fb.addEventListener('pointerdown', function (e) { e.preventDefault(); openFishSetup(); });
}

/* ================= 21. 启动 ================= */
function fit() {
  const s = Math.min((window.innerWidth - 14) / 390, (window.innerHeight - 14) / 844, 1.45);
  $('#phone').style.transform = 'scale(' + s + ')';
}
function init() {
  fit();
  window.addEventListener('resize', fit);
  initAudio();
  document.addEventListener('click', function (e) {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const fn = ACTIONS[t.dataset.act];
    if (!fn) return;
    e.preventDefault();
    playClick();
    fn(t.dataset.arg, t);
  });
  $('#muteBtn').addEventListener('click', function (e) { e.stopPropagation(); toggleMute(); });
  $('#helpBtn').addEventListener('click', function (e) { e.stopPropagation(); playClick(); openHelp(); });
  document.addEventListener('pointerdown', function () { startBgm(); }, { once: true });
  document.addEventListener('pointerdown', function (e) {
    if (fishing) fishing.hold = true;
  });
  renderScene();
  if (!state.seenIntro) showIntro();
  if (!state.friend && (!state.friendNext || state.friendNext < now())) state.friendNext = now() + T(2 * 3600) * 1000;

  // 便于截图/自测的只读参数（正常打开不受影响）
  const q = new URLSearchParams(location.search);
  if (q.get('intro') === '0') { state.seenIntro = true; const e = document.getElementById('intro'); if (e) e.remove(); }
  if (q.get('scene') !== null) { state.scene = clamp(Number(q.get('scene')) || 0, 0, 4); renderScene(); }
  const pmap = { shop: openShop, mail: openMail, projects: openProjects, loadout: openLoadout, field: openField, pots: openPots, gallery: openGallery, inventory: openInventory, help: openHelp, cook: openCook, craft: openCraft, lottery: openLottery };
  if (q.get('panel') && pmap[q.get('panel')]) pmap[q.get('panel')]();
  tick();
  setInterval(tick, 1000);
  window.TT = {
    get state() { return state; },
    addItem: addItem, save: save, renderScene: renderScene, openPanel: openPanel,
    actions: ACTIONS, giveItem: function (id, n) { addItem(id, n); renderScene(); },
    get fishing() { return fishing; }, winFish: fishWin, closeFishUI: closeFishUI,
    canDepart: canDepart, refresh: function () { refreshTop(); renderHUD(); renderScene(); }
  };
}
window.addEventListener('DOMContentLoaded', init);


</script>
