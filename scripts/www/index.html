<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>食谱 V1.0.0</title>
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235B9BD5'/%3E%3Cpath d='M13 33h38c0 10.5-8.5 19-19 19s-19-8.5-19-19z' fill='%23fff'/%3E%3Cpath d='M20 23h24v5H20z' fill='%23fff' opacity='.75'/%3E%3C/svg%3E">
<style>
/* ===== Material 3 令牌（Google 蓝主色）===== */
:root{
  --primary:#1A73E8;
  --on-primary:#FFFFFF;
  --primary-container:#D3E3FD;
  --on-primary-container:#041E49;
  --surface:#FFFFFF;
  --surface-1:#F7F9FC;
  --surface-2:#EEF2F8;
  --surface-3:#E4EAF3;
  --outline:#C3CAD5;
  --divider:#E6EAF0;
  --on-surface:#1B1B1F;
  --on-surface-variant:#5F6368;
  --error:#B3261E;
  --gold:#FBBC04;
  --on-gold:#3A2A00;
  --nav:#F7F9FC;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:"Roboto","Noto Sans SC","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--on-surface);
  background:var(--surface);
  display:flex;
  align-items:stretch;
  justify-content:center;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}

/* ===== 手机外框 ===== */
.app{
  position:relative;
  width:min(440px,100vw);
  height:100dvh;
  background:var(--surface);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
@media (min-width:620px) and (min-height:740px){
  body{background:#E9EDF3;align-items:center;padding:22px}
  .app{
    height:min(862px,calc(100dvh - 44px));
    border-radius:28px;
    box-shadow:0 18px 48px rgba(32,45,68,.16);
  }
}

/* ===== 页面骨架 ===== */
.stack{position:relative;flex:1;min-height:0}
.view{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  overflow-y:auto;
  overscroll-behavior:contain;
  opacity:0;
  pointer-events:none;
  transition:opacity .16s ease;
}
.view.active{opacity:1;pointer-events:auto}

/* ===== M3 顶部应用栏 ===== */
.head{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:6px;
  padding:18px 16px 10px;
}
.head h1{
  margin:0;
  font-size:28px;
  font-weight:500;
  letter-spacing:.2px;
  line-height:1.24;
  color:var(--on-surface);
}
.head .bar{display:none}
.icon-btn{
  flex:0 0 auto;
  width:40px;height:40px;
  padding:0;
  border:0;
  border-radius:50%;
  background:transparent;
  display:grid;
  place-items:center;
  color:var(--on-surface);
  transition:background .15s ease;
}
.icon-btn:active{background:rgba(26,115,232,.12)}
.icon-btn svg{width:22px;height:22px}

/* ===== 视图一：推荐 ===== */
#view-rec{padding-bottom:20px}
.timebar{
  flex:0 0 auto;
  position:sticky;
  top:0;
  z-index:6;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 20px 10px;
  background:var(--surface);
  border-bottom:1px solid var(--divider);
}
.tb-date{font-size:14px;color:var(--on-surface-variant);letter-spacing:.2px}
.tb-time{
  font-size:16px;
  font-weight:500;
  color:var(--primary);
  font-variant-numeric:tabular-nums;
}
.rec-wrap{padding:18px 20px 46px;position:relative;flex:1;display:flex;flex-direction:column}
.rec-card{background:var(--surface-2);border-radius:24px;padding:20px 24px}
.rec-accent{display:none}
.rec-name{font-size:20px;font-weight:500;color:var(--on-surface);letter-spacing:.2px;word-break:break-word}
.rec-detail{padding:20px 2px 0}
.rec-img{display:block;width:100%;max-height:230px;object-fit:cover;border-radius:20px}
.rec-content{
  margin:16px 0 0;
  font-size:15.5px;
  line-height:1.8;
  color:var(--on-surface-variant);
  white-space:pre-wrap;
  word-break:break-word;
}
.rec-content:first-child{margin-top:0}

/* 空状态：推荐 / 我的共用，位置与字号一致 */
.empty{
  display:flex;
  flex:1;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
}
.kao{font-size:30px;line-height:1.3;color:var(--on-surface-variant);letter-spacing:1px}
.none{font-size:16px;color:var(--on-surface-variant)}

/* ===== 视图二：我的 ===== */
#view-mine{padding-bottom:18px}
.mine-list{flex:1;display:flex;flex-direction:column;padding:8px 16px 0}
.item{position:relative;border-radius:20px;overflow:hidden;margin-bottom:10px;flex:0 0 auto}
/* 右滑露出的星标按钮：与删除按钮同规格，黄色圆形，圆内「星标」二字 */
.star-wrap{
  position:absolute;
  left:0;top:0;bottom:0;
  width:92px;
  display:grid;
  place-items:center;
  z-index:0;
}
.del-wrap{
  position:absolute;
  right:0;top:0;bottom:0;
  width:92px;
  display:grid;
  place-items:center;
  z-index:0;
}
.del{
  width:56px;height:56px;
  border:0;
  border-radius:50%;
  background:var(--error);
  color:#fff;
  display:grid;
  place-items:center;
  transition:transform .14s ease,filter .14s ease;
}
.del:active{transform:scale(.92);filter:brightness(.96)}
.del svg{width:24px;height:24px}
.star-btn{
  width:56px;height:56px;
  border:0;
  border-radius:50%;
  background:var(--gold);
  color:var(--on-gold);
  font-size:14px;
  font-weight:500;
  letter-spacing:1px;
  line-height:1;
  display:grid;
  place-items:center;
  transition:transform .14s ease,filter .14s ease;
}
.star-btn:active{transform:scale(.92);filter:brightness(.96)}
.pin-star{
  display:inline-block;
  margin-right:6px;
  font-size:14px;
  color:#C58B00;
  vertical-align:1px;
}
.card{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:14px;
  padding:12px 14px;
  background:var(--surface-1);
  border-radius:20px;
  touch-action:pan-y;
  transition:transform .26s cubic-bezier(.22,.7,.3,1);
  will-change:transform;
}
.card.no-anim{transition:none}
.thumb{
  flex:0 0 auto;
  width:64px;height:64px;
  border-radius:16px;
  background:var(--primary-container);
  color:var(--on-primary-container);
  font-size:13px;
  display:grid;
  place-items:center;
  overflow:hidden;
  user-select:none;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.meta{min-width:0;flex:1}
.rname{
  font-size:17px;
  font-weight:500;
  color:var(--on-surface);
  line-height:1.4;
  word-break:break-word;
}
.tastes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:40px;
  height:26px;
  padding:0 10px;
  border:1px solid var(--outline);
  border-radius:13px;
  font-size:13px;
  color:var(--on-surface-variant);
  background:transparent;
}

/* M3 悬浮按钮 */
.fab{
  position:absolute;
  right:20px;
  bottom:96px;
  width:56px;height:56px;
  border-radius:16px;
  border:0;
  background:var(--primary);
  display:none;
  place-items:center;
  box-shadow:0 6px 16px rgba(26,115,232,.34);
  z-index:4;
  transition:transform .15s ease,box-shadow .15s ease;
}
.fab.show{display:grid}
.fab:active{transform:scale(.94);box-shadow:0 3px 8px rgba(26,115,232,.28)}
.fab svg{width:24px;height:24px}

/* ===== 视图三：添加 / 编辑食谱 ===== */
#view-edit{overflow:hidden}
.edit-body{flex:1;overflow-y:auto;padding:4px 16px 8px;display:flex;flex-direction:column;gap:16px}
.pick-wrap{position:relative}
.pick{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  min-height:64px;
  border:1px solid var(--outline);
  border-radius:20px;
  background:transparent;
  color:var(--on-surface-variant);
  font-size:15px;
  overflow:hidden;
  padding:0;
}
.pick.has-img{min-height:0;height:200px;border:0;background:var(--surface-2)}
.pick svg{flex:0 0 auto;width:22px;height:22px}
.pick img{width:100%;height:200px;object-fit:cover;display:block}
.pick-tip{
  position:absolute;
  left:0;right:0;bottom:0;
  padding:8px 14px;
  font-size:13px;
  color:#fff;
  text-align:left;
  background:linear-gradient(transparent,rgba(0,0,0,.55));
}
.remove-img{
  position:absolute;
  right:10px;top:10px;
  width:32px;height:32px;
  border-radius:50%;
  border:0;
  background:rgba(32,33,36,.72);
  color:#fff;
  font-size:16px;
  line-height:1;
  display:none;
  place-items:center;
  z-index:2;
}
.remove-img.show{display:grid}

/* M3 填充式文本输入框 */
.tf{position:relative}
.tf-input{
  width:100%;
  border:0;
  border-radius:12px;
  background:var(--surface-2);
  padding:22px 16px 10px;
  font-size:16px;
  color:var(--on-surface);
  outline:none;
  transition:background .15s ease,box-shadow .15s ease;
}
.tf-input:focus{background:var(--surface-3);box-shadow:inset 0 -2px 0 var(--primary)}
.tf-label{
  position:absolute;
  left:16px;
  top:19px;
  font-size:15px;
  color:var(--on-surface-variant);
  pointer-events:none;
  transition:top .16s ease,font-size .16s ease,color .16s ease;
}
.tf-input:focus + .tf-label,
.tf-input:not(:placeholder-shown) + .tf-label{
  top:8px;
  font-size:12px;
  color:var(--primary);
}
.ta{min-height:196px;line-height:1.7;resize:none;padding-top:26px}

/* M3 筛选胶囊 */
.taste-block{display:flex;flex-direction:column;gap:10px}
.taste-title{font-size:12px;font-weight:500;letter-spacing:1px;color:var(--on-surface-variant)}
.taste-pick{display:flex;flex-wrap:wrap;gap:10px}
.taste{
  height:36px;
  min-width:56px;
  padding:0 14px;
  border:1px solid var(--outline);
  border-radius:18px;
  background:transparent;
  font-size:15px;
  color:var(--on-surface-variant);
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.taste.on{
  background:var(--primary-container);
  border-color:transparent;
  color:var(--on-primary-container);
  font-weight:500;
}

.edit-foot,
.detail-foot{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 16px 16px;
}
.save,
.edit-btn{
  flex:1;
  height:52px;
  border:0;
  border-radius:26px;
  background:var(--primary);
  color:var(--on-primary);
  font-size:16px;
  font-weight:500;
  letter-spacing:2px;
  transition:filter .15s ease,transform .15s ease;
}
.save:active,
.edit-btn:active{filter:brightness(.94);transform:scale(.99)}
.back{display:none}

/* ===== 视图：食谱详情 ===== */
#view-detail{padding-bottom:8px}
.detail-body{flex:1;overflow-y:auto;padding:4px 16px 4px}
.detail-cover{
  width:100%;
  height:200px;
  border-radius:24px;
  background:var(--surface-2);
  color:var(--on-surface-variant);
  font-size:14px;
  display:grid;
  place-items:center;
  overflow:hidden;
}
.detail-cover img{width:100%;height:100%;object-fit:cover;display:block}
.detail-name{
  font-size:22px;
  font-weight:500;
  color:var(--on-surface);
  margin:16px 0 6px;
  letter-spacing:.2px;
  word-break:break-word;
}
.detail-meta{font-size:13px;color:var(--on-surface-variant)}
.detail-tastes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.detail-sec{
  margin:22px 0 10px;
  font-size:13px;
  font-weight:500;
  letter-spacing:1.5px;
  color:var(--on-surface-variant);
}
.detail-text{
  font-size:15.5px;
  line-height:1.85;
  color:var(--on-surface);
  white-space:pre-wrap;
  word-break:break-word;
  padding-bottom:8px;
}
.detail-text.muted{color:var(--on-surface-variant)}

/* ===== 视图四：关于 ===== */
#view-about{padding-bottom:24px}
.about-card{
  margin:auto 16px;
  padding:32px 24px 26px;
  border-radius:28px;
  background:var(--surface-1);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  flex:0 0 auto;
}
.about-img{
  width:104px;height:104px;
  border-radius:52px;
  background:var(--primary-container);
  display:grid;
  place-items:center;
  overflow:hidden;
  margin-bottom:10px;
}
.about-img img{width:78%;height:78%;object-fit:contain;display:block}
.about-head{display:flex;flex-direction:column;align-items:center;gap:4px}
.about-title{font-size:20px;font-weight:500;color:var(--on-surface);letter-spacing:3px}
.about-ver{font-size:13px;color:var(--on-surface-variant)}
.about-note{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  width:100%;
  margin-top:22px;
  padding-top:20px;
  border-top:1px solid var(--divider);
}
.note-chip{
  display:inline-flex;
  align-items:center;
  height:28px;
  padding:0 12px;
  border-radius:14px;
  background:var(--primary-container);
  color:var(--on-primary-container);
  font-size:12px;
  font-weight:500;
  letter-spacing:.5px;
}
.note-text{font-size:12.5px;color:var(--on-surface-variant);text-align:center;line-height:1.5}
.stripes{display:none}

/* ===== M3 底部导航栏 ===== */
.tabbar{
  flex:0 0 auto;
  height:80px;
  background:var(--nav);
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:0 8px env(safe-area-inset-bottom);
  z-index:5;
}
.tab{
  border:0;
  background:none;
  padding:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  width:88px;
}
.pill{
  width:64px;height:32px;
  border-radius:16px;
  background:transparent;
  color:var(--on-surface-variant);
  display:grid;
  place-items:center;
  transition:background .2s ease,color .2s ease;
}
.pill svg{width:20px;height:20px}
/* 推荐标签直接用 ★ 字符，不用自绘图形 */
.star-glyph{
  font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",sans-serif;
  font-size:19px;
  line-height:1;
  color:inherit;
  display:grid;
  place-items:center;
  padding-bottom:1px;
}
.tab-label{font-size:11.5px;color:var(--on-surface-variant);letter-spacing:.5px}
.tab.active .pill{background:var(--primary-container);color:var(--primary)}
.tab.active .tab-label{color:var(--primary);font-weight:500}

/* ===== M3 Snackbar ===== */
.toast{
  position:absolute;
  left:16px;right:16px;
  bottom:96px;
  transform:translateY(8px);
  background:#303134;
  color:#fff;
  font-size:14px;
  padding:14px 16px;
  border-radius:8px;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s,transform .2s;
  z-index:20;
}
.toast.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<div class="app">

  <div class="stack">

    <!-- ===== 视图：推荐 ===== -->
    <section class="view active" id="view-rec">
      <header class="head"><h1>推荐</h1><span class="bar"></span></header>
      <div class="timebar" aria-label="当前日期时间">
        <span class="tb-date" id="tbDate"></span>
        <span class="tb-time" id="tbTime"></span>
      </div>
      <div class="rec-wrap" id="recWrap"></div>
    </section>

    <!-- ===== 视图：我的 ===== -->
    <section class="view" id="view-mine">
      <header class="head"><h1>我的</h1><span class="bar"></span></header>
      <div class="mine-list" id="mineList"></div>
    </section>

    <!-- ===== 视图：添加食谱 ===== -->
    <section class="view" id="view-edit">
      <header class="head">
        <button class="icon-btn" id="backBtn" type="button" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M19 12H5"></path><path d="M11.5 5.5 5 12l6.5 6.5"></path>
          </svg>
        </button>
        <h1>添加食谱</h1>
      </header>

      <div class="edit-body">
        <div class="pick-wrap">
          <button class="pick" id="pickBtn" type="button">添加图片</button>
          <button class="remove-img" id="removeImg" type="button" aria-label="移除图片">×</button>
        </div>
        <input type="file" id="fileInput" accept="image/*" hidden>

        <div class="tf">
          <input class="tf-input" id="nameInput" type="text" placeholder=" " maxlength="30" autocomplete="off">
          <label class="tf-label" for="nameInput">名称</label>
        </div>

        <div class="tf">
          <textarea class="tf-input ta" id="contentInput" placeholder=" " maxlength="1200" spellcheck="false"></textarea>
          <label class="tf-label" for="contentInput">食材 &amp; 做法</label>
        </div>

        <div class="taste-block">
          <span class="taste-title">口味</span>
          <div class="taste-pick" id="tastePick"></div>
        </div>
      </div>

      <div class="edit-foot">
        <button class="save" id="saveBtn" type="button">保存</button>
      </div>
    </section>

    <!-- ===== 视图：食谱详情 ===== -->
    <section class="view" id="view-detail">
      <header class="head">
        <button class="icon-btn" id="detailBack" type="button" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M19 12H5"></path><path d="M11.5 5.5 5 12l6.5 6.5"></path>
          </svg>
        </button>
        <h1>食谱详情</h1>
      </header>

      <div class="detail-body" id="detailBody"></div>

      <div class="detail-foot">
        <button class="edit-btn" id="editBtn" type="button">编辑</button>
      </div>
    </section>

    <!-- ===== 视图：关于 ===== -->
    <section class="view" id="view-about">
      <header class="head"><h1>关于</h1><span class="bar"></span></header>
      <div class="about-card">
        <div class="about-img">
          <img src="assets/axolotl.png" alt="美西螈">
        </div>
        <div class="about-head">
          <span class="about-title">食谱</span>
          <span class="about-ver">V1.0.0</span>
        </div>
        <div class="about-note">
          <span class="note-chip">本地存储</span>
          <span class="note-text">食谱只保存在这台设备上，不会上传</span>
        </div>
      </div>
    </section>

  </div>

  <!-- 悬浮添加 -->
  <button class="fab" id="fab" type="button" aria-label="添加食谱">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <path d="M12 4.5v15M4.5 12h15"></path>
    </svg>
  </button>

  <!-- ===== 底部标签栏 ===== -->
  <nav class="tabbar">
    <button class="tab active" data-go="rec" type="button">
      <span class="pill">
        <span class="star-glyph" aria-hidden="true">★</span>
      </span>
      <span class="tab-label">推荐</span>
    </button>
    <button class="tab" data-go="mine" type="button">
      <span class="pill">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c.9 5.2 4.6 8.9 9.8 9.8-5.2.9-8.9 4.6-9.8 9.8-.9-5.2-4.6-8.9-9.8-9.8 5.2-.9 8.9-4.6 9.8-9.8z"/></svg>
      </span>
      <span class="tab-label">我的</span>
    </button>
    <button class="tab" data-go="about" type="button">
      <span class="pill">
        <svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58c.05-.3.07-.64.07-.94zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
      </span>
      <span class="tab-label">关于</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ================= 数据层 ================= */
const KEY = 'shipu_recipes_v2';
const TASTES = ['酸','甜','苦','辣','咸','鲜'];
const MINE_EMPTY_KAO = '╮(╯_╰)╭';
const REC_EMPTY_KAO = 'O((\u003eω\u003c ))o';

/* 默认没有任何食谱，全部由用户自己添加 */
function loadRecipes(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr)) return arr;
    }
  }catch(e){}
  return [];
}
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(recipes)); }catch(e){}
}

let recipes = loadRecipes();
let recId = null;          // 推荐位上那条食谱的 id
let view = 'rec';          // rec | mine | about | edit | detail
let draft = null;          // 编辑中的草稿
let editingId = null;      // 正在编辑的既有食谱 id；null 表示新增
let detailId = null;       // 详情页正在查看的食谱 id

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const pad2 = n => String(n).padStart(2,'0');
function fmtDate(ts){
  const d = new Date(ts);
  return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
function fmtTime(ts){
  const d = new Date(ts);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function pickRandom(){
  if(!recipes.length) return null;
  return recipes[Math.floor(Math.random() * recipes.length)].id;
}
let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

/* ================= 渲染：推荐 ================= */
function renderRec(){
  const host = $('recWrap');
  const r = recipes.find(x => x.id === recId) || null;

  if(!r){
    host.innerHTML =
      '<div class="empty rec-empty"><div class="kao">' + esc(REC_EMPTY_KAO) + '</div><div class="none">无</div></div>';
    return;
  }

  const img = r.image ? '<img class="rec-img" src="' + r.image + '" alt="' + esc(r.name) + '">' : '';
  const body = (r.content && r.content.trim())
    ? '<p class="rec-content">' + esc(r.content) + '</p>' : '';

  const detail = (img || body)
    ? '<div class="rec-detail">' + img + body + '</div>'
    : '<div class="empty rec-empty"><div class="kao">' + esc(REC_EMPTY_KAO) + '</div><div class="none">无</div></div>';

  host.innerHTML =
    '<div class="rec-card">' +
      '<span class="rec-accent"></span>' +
      '<div class="rec-inner">' +
        '<div class="rec-name">' + esc(r.name) + '</div>' +
      '</div>' +
    '</div>' + detail;
}

/* 顶部时间条：显示当前真实日期时间，每 10 秒同步一次 */
function tickClock(){
  const now = Date.now();
  const d = $('tbDate'), t = $('tbTime');
  if(d) d.textContent = fmtDate(now);
  if(t) t.textContent = fmtTime(now);
}

/* ================= 渲染：我的 ================= */
function renderMine(){
  const host = $('mineList');

  if(!recipes.length){
    host.innerHTML =
      '<div class="empty mine-empty"><div class="kao">' + esc(MINE_EMPTY_KAO) + '</div><div class="none">无</div></div>';
    return;
  }

  /* 星标条目常驻在最前面；同为星标时，最近打标的排在更前 */
  const list = recipes.slice().sort((a, b) => {
    const sa = a.starred ? 1 : 0, sb = b.starred ? 1 : 0;
    if(sa !== sb) return sb - sa;
    if(sa && sb) return (b.starAt || 0) - (a.starAt || 0);
    return 0;
  });

  host.innerHTML = list.map(r => {
    const thumb = r.image
      ? '<div class="thumb"><img src="' + r.image + '" alt=""></div>'
      : '<div class="thumb">图片</div>';
    const chips = (r.tastes || []).map(t => '<span class="chip">' + esc(t) + '</span>').join('');
    return '' +
      '<div class="item" data-id="' + r.id + '">' +
        '<div class="star-wrap">' +
          '<button class="star-btn" type="button" data-star="' + r.id + '" aria-label="星标">星标</button>' +
        '</div>' +
        '<div class="del-wrap">' +
          '<button class="del" type="button" data-del="' + r.id + '" aria-label="删除">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M4.9 6.9h14.2"></path>' +
              '<path d="M9.5 6.9V5.2c0-.5.4-.9.9-.9h3.2c.5 0 .9.4.9.9v1.7"></path>' +
              '<path d="M7 6.9l.8 12c.05.68.61 1.2 1.28 1.2h5.84c.67 0 1.23-.52 1.28-1.2L17 6.9"></path>' +
              '<path d="M10.2 10.5v5.9M13.8 10.5v5.9"></path>' +
            '</svg>' +
          '</button>' +
        '</div>' +
        '<div class="card">' +
          thumb +
          '<div class="meta">' +
            '<div class="rname">' + (r.starred ? '<span class="pin-star">★</span>' : '') + esc(r.name) + '</div>' +
            (chips ? '<div class="tastes">' + chips + '</div>' : '') +
          '</div>' +
        '</div>' +
      '</div>';
  }).join('');

  bindSwipe();
}

/* ---------- 左滑删除 / 右滑星标 ---------- */
const OPEN_X = -96;   // 左滑露出删除
const OPEN_STAR = 96; // 右滑露出星标
let openCard = null;

function closeCard(card){
  if(!card) return;
  card.classList.add('no-anim');
  card.style.transform = 'translateX(0px)';
  card._open = 0;
  requestAnimationFrame(() => card.classList.remove('no-anim'));
  if(openCard === card) openCard = null;
}

function bindSwipe(){
  document.querySelectorAll('#mineList .card').forEach(card => {
    let startX = 0, startY = 0, base = 0, dragging = false, pid = null, moved = false;

    card.addEventListener('pointerdown', e => {
      if(e.button !== undefined && e.button !== 0) return;
      pid = e.pointerId;
      startX = e.clientX; startY = e.clientY;
      base = (openCard === card) ? (card._open || 0) : 0;
      dragging = false; moved = false;
    });

    card.addEventListener('pointermove', e => {
      if(pid === null || e.pointerId !== pid) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if(!dragging){
        if(Math.abs(dx) < 7 && Math.abs(dy) < 7) return;
        if(Math.abs(dy) > Math.abs(dx)){ pid = null; return; } // 纵向滚动
        dragging = true;
        card.classList.add('no-anim');
        try{ card.setPointerCapture(pid); }catch(err){}
      }
      moved = true;
      const t = Math.max(OPEN_X, Math.min(OPEN_STAR, base + dx));
      card.style.transform = 'translateX(' + t + 'px)';
      card._t = t;
    });

    const end = () => {
      if(dragging){
        const t = card._t || 0;
        card.classList.remove('no-anim');
        let snap = 0;
        if(t <= OPEN_X / 2) snap = OPEN_X;        // 向左过半 -> 删除
        else if(t >= OPEN_STAR / 2) snap = OPEN_STAR; // 向右过半 -> 星标
        if(snap !== 0){
          if(openCard && openCard !== card) closeCard(openCard);
          openCard = card;
          card._open = snap;
          card.style.transform = 'translateX(' + snap + 'px)';
        }else{
          if(openCard === card) openCard = null;
          card._open = 0;
          card.style.transform = 'translateX(0px)';
        }
      }
      pid = null; dragging = false;
    };
    card.addEventListener('pointerup', end);
    card.addEventListener('pointercancel', end);

    card.addEventListener('click', () => {
      if(moved){ moved = false; return; }
      if(openCard === card){ closeCard(card); return; }
      if(openCard){ closeCard(openCard); return; }
      const item = card.closest('.item');
      if(item) openDetail(item.getAttribute('data-id'));
    });
  });
}

/* 星标 / 取消星标 */
$('mineList').addEventListener('click', e => {
  const btn = e.target.closest('[data-star]');
  if(!btn) return;
  const id = btn.getAttribute('data-star');
  const r = recipes.find(x => x.id === id);
  if(!r) return;
  r.starred = !r.starred;
  r.starAt = r.starred ? Date.now() : 0;
  persist();
  if(openCard){ openCard._open = 0; openCard = null; }
  renderMine();
  toast(r.starred ? '已添加星标，已置顶' : '已取消星标');
});

/* 删除 */
$('mineList').addEventListener('click', e => {
  const btn = e.target.closest('[data-del]');
  if(!btn) return;
  const id = btn.getAttribute('data-del');
  recipes = recipes.filter(r => r.id !== id);
  persist();
  if(recId === id) recId = pickRandom();
  if(openCard){ openCard._open = 0; openCard = null; }
  renderMine();
  renderRec();
  toast('已删除');
});

/* ================= 渲染：详情页 ================= */
function openDetail(id){
  if(!id || !recipes.some(r => r.id === id)) return;
  if(openCard) closeCard(openCard);
  detailId = id;
  renderDetail();
  setView('detail');
}

function renderDetail(){
  const r = recipes.find(x => x.id === detailId);
  if(!r){ setView('mine'); renderMine(); return; }
  const cover = r.image
    ? '<div class="detail-cover"><img src="' + r.image + '" alt="' + esc(r.name) + '"></div>'
    : '<div class="detail-cover">图片</div>';
  const tastes = (r.tastes && r.tastes.length)
    ? '<div class="detail-tastes">' + r.tastes.map(t => '<span class="chip">' + esc(t) + '</span>').join('') + '</div>'
    : '';
  const body = (r.content && r.content.trim())
    ? '<div class="detail-text">' + esc(r.content) + '</div>'
    : '<div class="detail-text muted">还没有填写食材 &amp; 做法</div>';
  $('detailBody').innerHTML =
    cover +
    '<div class="detail-name">' + esc(r.name) + '</div>' +
    '<div class="detail-meta">保存于 ' + fmtDate(r.createdAt) + ' ' + fmtTime(r.createdAt) + '</div>' +
    tastes +
    '<div class="detail-sec">食材 &amp; 做法</div>' +
    body;
  $('detailBody').scrollTop = 0;
}

$('editBtn').addEventListener('click', () => openEdit(detailId));
$('detailBack').addEventListener('click', () => {
  draft = null;
  editingId = null;
  setView('mine');
});

/* ================= 渲染：编辑页 ================= */
function newDraft(){
  return { image: null, name: '', content: '', tastes: [] };
}

function renderTastes(){
  const host = $('tastePick');
  host.innerHTML = TASTES.map(t =>
    '<button class="taste' + (draft.tastes.includes(t) ? ' on' : '') + '" type="button" data-taste="' + t + '">' + t + '</button>'
  ).join('');
}

function renderPick(){
  const btn = $('pickBtn');
  const rm = $('removeImg');
  if(draft.image){
    btn.classList.add('has-img');
    btn.innerHTML = '<img src="' + draft.image + '" alt=""><span class="pick-tip">点击更换图片</span>';
    rm.classList.add('show');
  }else{
    btn.classList.remove('has-img');
    btn.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="3.2" y="4.8" width="17.6" height="14.4" rx="2.4"></rect>' +
        '<circle cx="8.6" cy="10" r="1.7"></circle>' +
        '<path d="M4.6 17.2l4.4-4.1c.5-.5 1.3-.5 1.8 0l3 2.8c.5.5 1.3.5 1.8 0l2.9-2.7"></path>' +
      '</svg><span>添加图片</span>';
    rm.classList.remove('show');
  }
}

function renderEdit(){
  $('nameInput').value = draft.name;
  $('contentInput').value = draft.content;
  renderPick();
  renderTastes();
}

function openEdit(id){
  editingId = (id && recipes.some(r => r.id === id)) ? id : null;
  if(editingId){
    const r = recipes.find(x => x.id === editingId);
    draft = {
      image: r.image || null,
      name: r.name || '',
      content: r.content || '',
      tastes: (r.tastes || []).slice()
    };
    renderEdit();
    setView('edit');
    setTimeout(() => {
      try{ $('nameInput').setSelectionRange(draft.name.length, draft.name.length); }catch(e){}
    }, 60);
  }else{
    draft = newDraft();
    renderEdit();
    setView('edit');
    setTimeout(() => { try{ $('nameInput').focus(); }catch(e){} }, 60);
  }
}

/* 图片选择与压缩 */
$('pickBtn').addEventListener('click', () => $('fileInput').click());
$('removeImg').addEventListener('click', e => {
  e.stopPropagation();
  draft.image = null;
  renderPick();
});
$('fileInput').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  try{
    draft.image = await shrink(file);
    renderPick();
  }catch(err){
    toast('图片读取失败');
  }
  e.target.value = '';
});

function shrink(file, max = 1000, quality = 0.86){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const scale = Math.min(1, max / Math.max(im.width, im.height));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(im.width * scale));
        cv.height = Math.max(1, Math.round(im.height * scale));
        const ctx = cv.getContext('2d');
        ctx.drawImage(im, 0, 0, cv.width, cv.height);
        const isPng = file.type === 'image/png';
        try{
          resolve(cv.toDataURL(isPng ? 'image/png' : 'image/jpeg', quality));
        }catch(err){ resolve(fr.result); }
      };
      im.onerror = () => resolve(fr.result);
      im.src = fr.result;
    };
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}

/* 表单交互 */
$('nameInput').addEventListener('input', e => { draft.name = e.target.value; });
$('contentInput').addEventListener('input', e => {
  draft.content = e.target.value;
});
$('tastePick').addEventListener('click', e => {
  const b = e.target.closest('[data-taste]');
  if(!b) return;
  const t = b.getAttribute('data-taste');
  if(draft.tastes.includes(t)) draft.tastes = draft.tastes.filter(x => x !== t);
  else draft.tastes.push(t);
  renderTastes();
});

$('saveBtn').addEventListener('click', () => {
  const name = (draft.name || '').trim();
  if(!name){ toast('请输入名称'); $('nameInput').focus(); return; }
  const payload = {
    name: name,
    content: (draft.content || '').trim(),
    tastes: draft.tastes.slice(),
    image: draft.image
  };

  if(editingId){
    /* 编辑既有食谱：原地更新，不新增、不改变列表位置与创建时间 */
    const r = recipes.find(x => x.id === editingId);
    if(!r){ toast('这条食谱已不存在'); editingId = null; setView('mine'); return; }
    r.name = payload.name;
    r.content = payload.content;
    r.tastes = payload.tastes;
    r.image = payload.image;
    persist();
    renderMine();
    renderRec();
    detailId = r.id;
    editingId = null;
    draft = null;
    renderDetail();
    setView('detail');
    toast('已保存');
    return;
  }

  recipes.unshift({
    id: 'r' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
    name: payload.name,
    content: payload.content,
    tastes: payload.tastes,
    image: payload.image,
    createdAt: Date.now()
  });
  persist();
  recId = pickRandom();          // 保存后重新随机挑选推荐
  renderRec();
  renderMine();
  draft = null;
  setView('mine');
  toast('已保存');
});

$('backBtn').addEventListener('click', () => {
  const cameFromDetail = !!editingId;
  draft = null;
  editingId = null;
  if(cameFromDetail){
    renderDetail();              // 放弃修改，回到未改动的详情
    setView('detail');
  }else{
    setView('mine');
  }
});

/* ================= 视图切换 ================= */
function setView(v){
  view = v;
  document.querySelectorAll('.view').forEach(el => {
    el.classList.toggle('active', el.id === 'view-' + v);
  });
  const navKey = (v === 'edit' || v === 'detail') ? 'mine' : v;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.go === navKey);
  });
  $('fab').classList.toggle('show', v === 'mine');
  document.querySelectorAll('.view').forEach(el => {
    if(el.classList.contains('active') && el.id !== 'view-edit') el.scrollTop = 0;
  });
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    const target = t.dataset.go;
    if(view === 'edit' && target !== 'mine'){ editingId = null; draft = null; }
    if(view === 'detail' && target !== 'mine'){ detailId = null; }
    if(target === 'mine' && view === 'detail'){ detailId = null; }
    setView(target);
    if(target === 'rec') renderRec();
    if(target === 'mine') renderMine();
  });
});

$('fab').addEventListener('click', () => openEdit(null));

/* 键盘：Esc 返回 */
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(view === 'edit'){
    const cameFromDetail = !!editingId;
    draft = null; editingId = null;
    if(cameFromDetail){ renderDetail(); setView('detail'); }
    else setView('mine');
  }
  else if(view === 'detail'){ detailId = null; setView('mine'); renderMine(); }
  else if(openCard){ closeCard(openCard); }
});

/* ================= 启动 ================= */
tickClock();
setInterval(tickClock, 10000);
recId = pickRandom();           // 每次打开软件都刷新推荐位
renderRec();
renderMine();
setView('rec');
</script>
</body>
</html>
